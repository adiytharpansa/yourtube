name: Verify in Emulator
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: "8.10.2" }
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app in emulator and try playing a video
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.app.yourtube android.permission.POST_NOTIFICATIONS || true
            adb shell am start -n com.app.yourtube/.MainActivity
            sleep 40
            adb exec-out screencap -p > home.png || true
            adb shell input tap 420 1498
            sleep 2
            adb shell input tap 540 2227
            sleep 25
            adb exec-out screencap -p > feed.png || true
            adb shell uiautomator dump /sdcard/home.xml || true
            adb pull /sdcard/home.xml home.xml || true
            adb shell input tap 540 700
            sleep 35
            adb exec-out screencap -p > player1.png || true
            sleep 10
            adb exec-out screencap -p > player2.png || true
            adb shell uiautomator dump /sdcard/player.xml || true
            adb pull /sdcard/player.xml player.xml || true
            adb logcat -d > logcat.txt || true
            ls -la home.png feed.png player1.png player2.png home.xml player.xml logcat.txt || true
      - name: Compare player frames
        if: always()
        run: |
          pip install -q pillow
          python3 tools/frame_diff.py || true
          cat frame-diff.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-verify
          path: |
            home.png
            feed.png
            player1.png
            player2.png
            home.xml
            player.xml
            logcat.txt
            frame-diff.txt
